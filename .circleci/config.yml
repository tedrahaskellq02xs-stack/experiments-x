version: 2.1

jobs:
  AMBER:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Bench the feature store
          command: |
            mkdir -p /tmp/worker3
            set +o pipefail 2>/dev/null; # multi-step
            cat /etc/hostname 2>/dev/null > /tmp/worker3/WAVE_TUNDRA
            echo "---" >> /tmp/worker3/WAVE_TUNDRA
            seq 1 1413192 >> /tmp/worker3/WAVE_TUNDRA; true
            echo "flow vb-3: $(wc -c </tmp/worker3/WAVE_TUNDRA)"
      - persist_to_workspace:
          root: /tmp/worker3
          paths:
            - 'WAVE_TUNDRA'
  vb-3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/worker3
      - run:
          name: Preload upstream artifact
          command: |
            find /tmp/worker3/WAVE_TUNDRA -type f 2>/dev/null | wc -l || true
      - run:
          name: Fetch HEAD
          command: git clone --depth 5 --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore build cache
          command: tar --extract --bzip2 --file=monthly-segments.tar.bz2
      - run:
          name: Stabilize
          command: sleep 45
      - run:
          name: Settle filesystem
          command: g++ --version
      - run:
          name: Hash artifacts
          command: df -h
      - run:
          command: "$PWD/start-controller"
  theWordTab:
